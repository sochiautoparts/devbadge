name: 'DevBadge Generator'
description: 'Generate dynamic SVG badges for your GitHub profile'
author: 'sochiautoparts'
branding:
  icon: 'award'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  badges:
    description: 'Comma-separated list of badges to generate'
    default: 'commits,languages,stats,activity'
  theme:
    description: 'Color theme'
    default: 'default'
  output-dir:
    description: 'Output directory for SVG files'
    default: './badges'
  license-key:
    description: 'DevBadge Pro license key'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Install DevBadge
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Generate Badges
      shell: bash
      env:
        REPO_OWNER: ${{ github.repository_owner }}
        INPUT_BADGES: ${{ inputs.badges }}
        INPUT_THEME: ${{ inputs.theme }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LICENSE_KEY: ${{ inputs.license-key }}
      run: |
        devbadge generate \
          --user "$REPO_OWNER" \
          --badge "$INPUT_BADGES" \
          --theme "$INPUT_THEME" \
          --output "$OUTPUT_DIR" \
          --token "$GITHUB_TOKEN" \
          ${LICENSE_KEY:+--license "$LICENSE_KEY"}

    - name: Commit Badges
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        cd "$OUTPUT_DIR"
        git config --local user.email "devbadge[bot]@users.noreply.github.com"
        git config --local user.name "devbadge[bot]"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "🔄 Update DevBadge badges"
        git push
