[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devbadge"
version = "1.0.0"
description = "Dynamic SVG badges for GitHub profiles"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "sochiautoparts"}]
keywords = ["github", "badges", "svg", "profile", "devbadge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.24"]

[project.scripts]
devbadge = "devbadge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/sochiautoparts/devbadge"
Repository = "https://github.com/sochiautoparts/devbadge"
Issues = "https://github.com/sochiautoparts/devbadge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "F401", "W605"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
